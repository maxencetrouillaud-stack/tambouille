<title>Tambouille</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : rail de 10 sections à gauche sur grand écran, barre de 5 onglets (dont « Plus ») en bas sur mobile ; colonne de contenu ≤ 1080 px */
:root{
  --bg:#F2F4EE; --surface:#FFFFFF; --surface-2:#E7ECE2; --ink:#16201A; --muted:#5B685F; --line:#D5DCCF;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --accent-soft:#DCEBE1; --saffron:#D8952C; --saffron-soft:#FBEBCF;
  --ok:#2E8552; --warn:#A85F0C; --bad:#C2412D; --bad-soft:#F8E1DC; --warn-soft:#F9E8D0; --ok-soft:#DDEFE3;
  --shadow:0 1px 2px rgb(22 32 26/.06),0 8px 24px -12px rgb(22 32 26/.18);
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
:root.acc-tomate{--accent:#B5452B;--accent-soft:#F7E0D8}
:root.acc-aubergine{--accent:#6B3F7A;--accent-soft:#EDE1F1}
:root.acc-ocean{--accent:#1F6380;--accent-soft:#DAEBF2}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#0E1310; --surface:#161D18; --surface-2:#1F2822; --ink:#E7EEE8; --muted:#97A59B; --line:#2B352E;
  --accent:#7CC59D; --accent-ink:#0E1310; --accent-soft:#1E3529; --saffron:#F0B65A; --saffron-soft:#3A2D16;
  --ok:#6CCB8F; --warn:#EDA552; --bad:#F27D68; --bad-soft:#3B1F1A; --warn-soft:#3A2A15; --ok-soft:#1C3325;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px -14px rgb(0 0 0/.6); color-scheme:dark}
  :root.acc-tomate:not([data-theme="light"]){--accent:#F08B6E;--accent-soft:#3E211A}
  :root.acc-aubergine:not([data-theme="light"]){--accent:#C99BD8;--accent-soft:#2F2135}
  :root.acc-ocean:not([data-theme="light"]){--accent:#7DC0DE;--accent-soft:#16303B}
}
:root[data-theme="dark"]{
  --bg:#0E1310; --surface:#161D18; --surface-2:#1F2822; --ink:#E7EEE8; --muted:#97A59B; --line:#2B352E;
  --accent:#7CC59D; --accent-ink:#0E1310; --accent-soft:#1E3529; --saffron:#F0B65A; --saffron-soft:#3A2D16;
  --ok:#6CCB8F; --warn:#EDA552; --bad:#F27D68; --bad-soft:#3B1F1A; --warn-soft:#3A2A15; --ok-soft:#1C3325;
  --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px -14px rgb(0 0 0/.6); color-scheme:dark}
:root[data-theme="dark"].acc-tomate{--accent:#F08B6E;--accent-soft:#3E211A}
:root[data-theme="dark"].acc-aubergine{--accent:#C99BD8;--accent-soft:#2F2135}
:root[data-theme="dark"].acc-ocean{--accent:#7DC0DE;--accent-soft:#16303B}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,6vw,40px);line-height:1.05;font-weight:800}
h2{font-size:19px;font-weight:600;display:flex;align-items:center;gap:8px}
h3{font-size:16px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic .f{fill:var(--surface)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.gap{justify-content:space-between;gap:12px}.center{justify-content:center}
.muted-t{color:var(--muted)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:16px;line-height:1.45}
.note .ic{width:16px;height:16px;margin-top:2px}
.fine{font-size:12px;color:var(--muted)}

/* Coque */
.app{max-width:1080px;margin:0 auto;padding-block:0 130px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;font:800 21px var(--f-display);letter-spacing:-.02em;margin-right:auto;text-decoration:none;color:inherit}
.logo{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:4px 10px;border-radius:99px;background:var(--surface-2)}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s=ok]::before{background:var(--ok)}.sync[data-s=saving]::before{background:var(--saffron)}.sync[data-s=err]::before{background:var(--bad)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav a,.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0}
.nav [aria-current=page]{color:var(--accent);background:var(--accent-soft)}
.nav .x{display:none}
.nav [data-r=accueil]{order:1}.nav [data-r=inventaire]{order:2}.nav [data-r=scanner]{order:3}.nav [data-r=recettes]{order:4}.nav .moreb{order:5}
.nav [data-r=scanner] .ic{background:var(--accent);color:var(--accent-ink);border-radius:12px;width:34px;height:28px;padding:4px 7px}
.nav [data-r=scanner][aria-current=page]{background:none}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:24;display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:99px;border:0;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:var(--shadow);text-decoration:none}
.fab .ic{color:var(--saffron)}
body[data-route=assistant] .fab{display:none}
@media (min-width:900px){
  body{padding-left:max(124px,env(safe-area-inset-left,0px))}
  .nav{top:0;right:auto;width:108px;grid-template-columns:1fr;align-content:center;gap:2px;border-top:0;border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto}
  .nav .x{display:flex}.nav .moreb{display:none}
  .nav a{order:0!important;padding:8px 4px}
  .nav [data-r=scanner] .ic{width:20px;height:20px;padding:0;background:none;color:inherit}
  .nav [data-r=scanner][aria-current=page]{background:var(--accent-soft)}
  .fab{bottom:24px}
  .app{padding-bottom:60px}
}
#timers{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column-reverse;gap:6px;width:min(300px,calc(100% - 200px));min-width:180px}
@media (min-width:900px){#timers{left:132px;bottom:24px}}
.cooking #timers{z-index:60;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px))}
.tmr .tl{display:none}@media (min-width:500px){.tmr .tl{display:block}}.cooking .tmr .tl{display:block}
.tmr{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink);color:var(--bg);padding:6px 6px 6px 12px;border-radius:14px;box-shadow:var(--shadow)}
.tmr .tl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;opacity:.8}
.tmr b{font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.tmr.ring{background:var(--saffron);color:#1d1406;animation:pulse 1s infinite}
.tmr .icon{background:transparent;color:inherit;border-color:transparent}
@keyframes pulse{50%{transform:scale(1.02)}}

/* Contrôles */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:9px 16px;border-radius:12px;border:1px solid transparent;background:var(--ink);color:var(--bg);font-weight:650;white-space:nowrap;transition:transform .12s,background .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost[aria-pressed=true]{color:var(--bad);border-color:var(--bad)}
.btn.ghost[aria-pressed=true] .ic{fill:currentColor}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px}
.btn.big{min-height:50px;padding:12px 20px;font-size:16px}
.btn.danger{background:var(--bad);color:#fff}.btn.ghost.danger{background:var(--surface);color:var(--bad)}
.btn[disabled],.icon[disabled]{opacity:.5;cursor:default}
.icon{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);flex:none;text-decoration:none}
.icon.sm{width:32px;height:32px;border-radius:10px}.icon.sm .ic{width:16px;height:16px}
.icon.xs{width:26px;height:26px;border-radius:8px}.icon.xs .ic{width:14px;height:14px}
.link{background:none;border:0;color:var(--accent);font-weight:650;display:inline-flex;align-items:center;gap:4px;padding:6px 0}
.link.danger{color:var(--bad)}
.link .ic{width:16px;height:16px}
input:not([type=checkbox]),select{min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-block:6px}
.seg button{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button small{font-size:11.5px;background:var(--surface-2);border-radius:99px;padding:0 7px;font-variant-numeric:tabular-nums}
.seg button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-selected=true] small{background:color-mix(in srgb,var(--bg) 20%,transparent)}
.seg.sm button{padding:6px 12px;font-size:13px}
.searchline{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-block:8px}
.searchline .ic{color:var(--muted)}.searchline input{border:0;padding-left:0;background:transparent}.searchline input:focus{outline:0}
.searchline:focus-within{outline:2px solid var(--accent);outline-offset:-1px}
.searchline.grow{flex:1;margin:0}
.stepper{display:inline-flex;align-items:center;gap:10px}.stepper b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;letter-spacing:.01em}
.pill .ic{width:13px;height:13px;stroke-width:2.4}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.muted{background:var(--surface-2);color:var(--muted)}
.pill.gaspi{background:var(--saffron-soft);color:var(--warn)}.pill.ai{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-block;font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--surface-2);color:var(--muted);vertical-align:1px}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.chip .ic{width:14px;height:14px}
.chip em{font-style:normal;font-weight:700;font-size:12px}
.chip.bad em{color:var(--bad)}.chip.warn em{color:var(--warn)}.chip.okc em{color:var(--ok)}
.btnchip{cursor:pointer}
.chip.tog{cursor:pointer}.chip.tog input{accent-color:var(--accent)}
.chip.tog:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:28px 16px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);grid-column:1/-1}
.empty b{color:var(--ink);font-size:16px}
.empty.sm{padding:14px;flex-direction:row;justify-content:center;flex-wrap:wrap;gap:8px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
.spin.big{width:34px;height:34px;border-width:3px;color:var(--accent)}
@keyframes sp{to{transform:rotate(1turn)}}
.alertline{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:14px;margin-block:8px}
.alertline.bad{background:var(--bad-soft);color:var(--bad)}.alertline.warn{background:var(--warn-soft);color:var(--warn)}
.alertline .ic{width:18px;height:18px;margin-top:1px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

/* Accueil */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--saffron-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:14px}
.hero{padding-block:8px 6px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.tonightrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:16px}
@media (max-width:560px){.tonightrow{grid-template-columns:1fr}}
.tonight{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 20px;border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font:700 clamp(17px,3.6vw,21px)/1.2 var(--f-display);box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .15s}
.tonight .ic{width:24px;height:24px;color:var(--saffron)}
.tonight::after{content:"";position:absolute;inset:0;background:radial-gradient(120px 60px at 90% 0%,color-mix(in srgb,var(--saffron) 35%,transparent),transparent);pointer-events:none}
.tonight:hover{transform:translateY(-1px)}
.wheelbtn{height:100%;border-radius:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stats.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.stats.four{grid-template-columns:repeat(2,1fr)}}
.stats>*{display:flex;flex-direction:column;align-items:flex-start;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;min-width:0}
.stats b{font:800 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted);line-height:1.25}
.stats .alert b{color:var(--bad)}
.block{margin-top:26px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px;flex-wrap:wrap}
.block .bhead{margin-top:0}
.bhead .ic{color:var(--accent)}
.custom{margin-top:24px;text-align:center}
.challenge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.challenge small{color:var(--muted)}
.hist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.hist li+li{border-top:1px solid var(--line)}
.hist button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;text-align:left}
.hist button span{min-width:0}
.hist small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hist em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.stars-i{font-style:normal;color:var(--saffron);font-size:12px}
.oldlist{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:14px;color:var(--muted)}

/* Cartes recette */
.grid{display:grid;gap:12px;margin-top:10px}
.g3,.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
@media (max-width:520px){.g3,.g4{grid-template-columns:1fr 1fr}.rcard h3{font-size:14.5px}.rcard .meta{font-size:12px}}
@media (max-width:360px){.g3,.g4{grid-template-columns:1fr}}
.rcard{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden;transition:transform .18s,box-shadow .18s;min-width:0}
.rcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.rtags{display:flex;flex-wrap:wrap;gap:4px}
.rcard h3{line-height:1.2}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.meta .ic{width:14px;height:14px}
.favdot{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--bad)}
.favdot .ic{width:16px;height:16px;fill:currentColor}
.stars-mini{position:absolute;top:8px;left:8px;background:var(--surface);color:var(--saffron);font-size:11px;padding:2px 7px;border-radius:99px;letter-spacing:1px}
.art{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:radial-gradient(circle at 25% 15%,hsl(var(--h) 70% 82%),hsl(var(--h) 45% 52%) 75%)}
.art.big{aspect-ratio:16/9}
.art .plate{position:absolute;left:50%;top:54%;width:62%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#fbfaf6 58%,#e9e6dc 60%,#f6f4ee 72%);box-shadow:0 14px 30px -10px rgb(0 0 0/.35)}
.art.big .plate{width:40%}
.art i{position:absolute;left:var(--x);top:var(--y);width:var(--s);aspect-ratio:1.3;transform:translate(-50%,-50%) rotate(var(--rot));border-radius:56% 44% 60% 40%/50% 60% 40% 50%;background:radial-gradient(circle at 35% 30%,hsl(var(--hh) 75% 70%),hsl(var(--hh) 55% 42%));box-shadow:0 2px 3px rgb(0 0 0/.18)}
.art.big i{width:calc(var(--s) * .65)}
.art .d3img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .45s;pointer-events:none;user-select:none}
.art.has3d .d3img{opacity:1}.art.has3d .plate,.art.has3d i,.rhead.has3d .art .plate,.rhead.has3d .art i,.rhead.has3d .art .d3img{display:none}
.rhead>.close{z-index:5}.d3view{position:absolute;inset:0;z-index:1;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}.d3view.grab{cursor:grabbing}
.d3view canvas{display:block;width:100%;height:100%}
.d3view .d3bar{position:absolute;left:12px;bottom:10px;display:flex;gap:6px}
.d3view .d3bar .icon{background:rgb(255 255 255/.82);color:#2a2622;backdrop-filter:blur(6px);box-shadow:0 2px 8px rgb(0 0 0/.15)}
.d3view .d3hint{position:absolute;right:12px;bottom:12px;font-size:.72rem;padding:3px 9px;border-radius:99px;background:rgb(0 0 0/.38);color:#fff;pointer-events:none;animation:d3fade 4s 2.5s forwards}
@keyframes d3fade{to{opacity:0}}
